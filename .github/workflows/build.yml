name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Prepare files
        run: |
          mkdir -p www
          [ -f index.html ] && cp index.html www/index.html || true
          ls -R www
          ls icon-*.png

      - name: Install dependencies
        run: |
          npm install
          MAJOR=$(node -p "require('@capacitor/core/package.json').version.split('.')[0]")
          npm install @capacitor/app@$MAJOR || true

      - name: Add Android platform
        run: npx cap add android

      - name: Set app version (each build is newer than the previous one)
        run: |
          G=android/app/build.gradle
          VN=$(node -p "require('./package.json').version")
          sed -i "s/versionCode [0-9]\+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$VN.${{ github.run_number }}\"/" $G
          grep -n "versionCode\|versionName" $G

      - name: Set app icons
        run: |
          IM=$(command -v magick || command -v convert)
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${pair%%:*}; s=${pair##*:}
            $IM icon-violet.png -resize ${s}x${s} $RES/mipmap-$d/ic_launcher.png
            cp $RES/mipmap-$d/ic_launcher.png $RES/mipmap-$d/ic_launcher_round.png
            cp $RES/mipmap-$d/ic_launcher.png $RES/mipmap-$d/ic_launcher_foreground.png
            for k in violet forest rose ocean sunset mono; do
              $IM icon-$k.png -resize ${s}x${s} $RES/mipmap-$d/ic_$k.png
            done
          done

      - name: Add notification permissions
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n <application#' "$MANIFEST"
          grep -n "uses-permission" "$MANIFEST"

      - name: Add notification icon (white card-stack silhouette for the status bar)
        run: |
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_stat_kartochki.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp"
              android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFFFF" android:fillType="evenOdd"
                  android:pathData="M6,6 H15 A2,2 0 0 1 17,8 V20 A2,2 0 0 1 15,22 H6 A2,2 0 0 1 4,20 V8 A2,2 0 0 1 6,6 Z M7,10 H14 V11.5 H7 Z M7,13.5 H14 V15 H7 Z M7,17 H11 V18.5 H7 Z" />
              <path android:strokeColor="#FFFFFFFF" android:strokeWidth="1.6"
                  android:strokeLineCap="round" android:strokeLineJoin="round"
                  android:pathData="M8.5,3.2 H17.5 A2,2 0 0 1 19.5,5.2 V16" />
          </vector>
          XML
          cat android/app/src/main/res/drawable/ic_stat_kartochki.xml

      - name: Add switchable app icons
        run: |
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          cat = '<category android:name="android.intent.category.LAUNCHER" />'
          assert s.count(cat) == 1, 'LAUNCHER category not found exactly once'
          s = s.replace(cat, '')
          al = ''
          for k in ['violet', 'forest', 'rose', 'ocean', 'sunset', 'mono']:
              en = 'true' if k == 'violet' else 'false'
              al += (
                  '\n <activity-alias android:name=".Icon_' + k + '"'
                  ' android:targetActivity=".MainActivity"'
                  ' android:enabled="' + en + '" android:exported="true"'
                  ' android:icon="@mipmap/ic_' + k + '"'
                  ' android:roundIcon="@mipmap/ic_' + k + '"'
                  ' android:label="@string/app_name">\n'
                  ' <intent-filter>\n'
                  ' <action android:name="android.intent.action.MAIN" />\n'
                  ' <category android:name="android.intent.category.LAUNCHER" />\n'
                  ' </intent-filter>\n'
                  ' </activity-alias>')
          assert s.count('</application>') == 1
          s = s.replace('</application>', al + '\n </application>')
          open(p, 'w', encoding='utf-8').write(s)
          PY
          D=android/app/src/main/java/com/kartochki/app
          ls $D
          cat > $D/IconPlugin.java <<'JAVA'
          package com.kartochki.app;

          import android.content.ComponentName;
          import android.content.pm.PackageManager;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "AppIcon")
          public class IconPlugin extends Plugin {
              private static final String[] NAMES = {"violet", "forest", "rose", "ocean", "sunset", "mono"};

              @PluginMethod
              public void setIcon(PluginCall call) {
                  String name = call.getString("name", "violet");
                  boolean ok = false;
                  for (String n : NAMES) if (n.equals(name)) ok = true;
                  if (!ok) { call.reject("unknown icon"); return; }
                  PackageManager pm = getContext().getPackageManager();
                  String pkg = getContext().getPackageName();
                  ComponentName target = new ComponentName(pkg, "com.kartochki.app.Icon_" + name);
                  pm.setComponentEnabledSetting(target, PackageManager.COMPONENT_ENABLED_STATE_ENABLED, PackageManager.DONT_KILL_APP);
                  for (String n : NAMES) {
                      if (n.equals(name)) continue;
                      ComponentName other = new ComponentName(pkg, "com.kartochki.app.Icon_" + n);
                      pm.setComponentEnabledSetting(other, PackageManager.COMPONENT_ENABLED_STATE_DISABLED, PackageManager.DONT_KILL_APP);
                  }
                  call.resolve(new JSObject());
              }
          }
          JAVA
          cat > $D/MainActivity.java <<'JAVA'
          package com.kartochki.app;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(IconPlugin.class);
                  registerPlugin(WidgetPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA
          cat android/app/src/main/AndroidManifest.xml

      - name: Add home screen widget
        run: |
          R=android/app/src/main/res
          D=android/app/src/main/java/com/kartochki/app
          mkdir -p $R/drawable-nodpi $R/layout $R/xml $R/drawable
          if [ -f bananchik_widget.png ]; then cp bananchik_widget.png $R/drawable-nodpi/banana_widget.png; else cp icon-violet.png $R/drawable-nodpi/banana_widget.png; fi
          cat > $R/drawable/widget_bg.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#E61E2A44" />
              <corners android:radius="22dp" />
          </shape>
          XML
          cat > $R/layout/widget_kartochki.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/widget_root"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:orientation="horizontal" android:gravity="center_vertical"
              android:padding="10dp" android:background="@drawable/widget_bg">
              <ImageView android:layout_width="56dp" android:layout_height="72dp"
                  android:src="@drawable/banana_widget" android:scaleType="fitCenter" />
              <LinearLayout android:layout_width="0dp" android:layout_height="wrap_content"
                  android:layout_weight="1" android:orientation="vertical" android:paddingLeft="10dp">
                  <TextView android:id="@+id/w_line1" android:layout_width="match_parent"
                      android:layout_height="wrap_content" android:text="🔥 0"
                      android:textColor="#FFFFFFFF" android:textSize="22sp" android:textStyle="bold" />
                  <TextView android:id="@+id/w_line2" android:layout_width="match_parent"
                      android:layout_height="wrap_content" android:text="✓"
                      android:textColor="#FFCFD8EE" android:textSize="15sp" />
              </LinearLayout>
          </LinearLayout>
          XML
          cat > $R/xml/widget_kartochki_info.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="180dp" android:minHeight="70dp"
              android:targetCellWidth="3" android:targetCellHeight="1"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/widget_kartochki"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen" />
          XML
          cat > $D/KartWidget.java <<'JAVA'
          package com.kartochki.app;

          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.widget.RemoteViews;

          public class KartWidget extends AppWidgetProvider {
              static void render(Context c, AppWidgetManager m, int[] ids) {
                  SharedPreferences sp = c.getSharedPreferences("kart_widget", Context.MODE_PRIVATE);
                  for (int id : ids) {
                      RemoteViews v = new RemoteViews(c.getPackageName(), R.layout.widget_kartochki);
                      v.setTextViewText(R.id.w_line1, sp.getString("line1", "🔥 0"));
                      v.setTextViewText(R.id.w_line2, sp.getString("line2", "✓"));
                      Intent i = new Intent(c, MainActivity.class);
                      i.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                      PendingIntent pi = PendingIntent.getActivity(c, 0, i, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                      v.setOnClickPendingIntent(R.id.widget_root, pi);
                      m.updateAppWidget(id, v);
                  }
              }
              @Override
              public void onUpdate(Context c, AppWidgetManager m, int[] ids) { render(c, m, ids); }
              static void refreshAll(Context c) {
                  AppWidgetManager m = AppWidgetManager.getInstance(c);
                  int[] ids = m.getAppWidgetIds(new ComponentName(c, KartWidget.class));
                  if (ids != null && ids.length > 0) render(c, m, ids);
              }
          }
          JAVA
          cat > $D/WidgetPlugin.java <<'JAVA'
          package com.kartochki.app;

          import android.content.Context;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "AppWidget")
          public class WidgetPlugin extends Plugin {
              @PluginMethod
              public void update(PluginCall call) {
                  Context c = getContext();
                  c.getSharedPreferences("kart_widget", Context.MODE_PRIVATE).edit()
                      .putString("line1", call.getString("line1", "🔥 0"))
                      .putString("line2", call.getString("line2", "✓"))
                      .apply();
                  KartWidget.refreshAll(c);
                  call.resolve(new JSObject());
              }
          }
          JAVA
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          rec = (
              '\n <receiver android:name=".KartWidget" android:exported="true">\n'
              ' <intent-filter>\n'
              ' <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />\n'
              ' </intent-filter>\n'
              ' <meta-data android:name="android.appwidget.provider"'
              ' android:resource="@xml/widget_kartochki_info" />\n'
              ' </receiver>')
          assert s.count('</application>') == 1
          s = s.replace('</application>', rec + '\n </application>')
          open(p, 'w', encoding='utf-8').write(s)
          PY
          grep -n "receiver" android/app/src/main/AndroidManifest.xml

      - name: Sync web files
        run: npx cap sync android

      - name: Use the same signing key every time (so updates install over old versions)
        run: |
          test -f debug.keystore
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | head -3

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: kartochki-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
