<!DOCTYPE html>
<!--
=====================  ЗАМЕТКИ ДЛЯ ИИ (читай перед правками)  =====================
Приложение «Карточки»: один файл index.html, чистый JS, без библиотек.
Данные: localStorage, ключ 'fc8' (тема: 'fct'). Ключи и структуру D НЕ менять;
новые поля в D добавлять лениво (if(D.x==null)...), чтобы старые сохранения не ломались.

ВАЖНО: ОБНОВЛЕНИЕ ПОВЕРХ СТАРОЙ ВЕРСИИ БЕЗ ПОТЕРИ ПРОГРЕССА
Пользователь собирает из этого файла APK и ставит новую сборку ПОВЕРХ старой.
Прогресс при этом должен сохраняться, поэтому:
 1) Не менять ключ хранилища 'fc8' и формат данных. Любые изменения D делать совместимыми.
 2) Если пользователь говорит, что новая сборка «конфликтует» со старой и приходится
    удалять приложение (и терять прогресс), причина НЕ в index.html. Это настройки сборки APK:
    - тот же package name / applicationId, что у старой сборки;
    - та же подпись (keystore). Новая подпись или режим debug/release = конфликт установки;
    - versionCode больше, чем у установленной версии.
    Напомни проверить эти три пункта в конструкторе APK и не менять их между сборками.
 3) Перед любой смене конструктора APK, подписи или package name посоветуй сохранить прогресс:
    Настройки → «Резервная копия» → «Сохранить прогресс», после установки «Загрузить прогресс».
 4) Из index.html подпись и номер версии APK изменить нельзя. Не обещай этого.

Правила работы:
 - Отвечать по-русски и коротко (пользователь с телефона), в конце маленький отчёт.
 - Не писать слова «новая версия».
 - Все новые тексты на трёх языках (D.lang: 0 en, 1 ru, 2 tk).
 - Новые иконки и рисунки только SVG, не эмодзи. Имена CSS-классов и функций проверять grep на конфликты.
 - Перед отдачей файла проверять в headless-браузере (playwright), сохранять в /mnt/user-data/outputs/index.html
   и отдавать через present_files.
 - Слайды презентации (kartochki-presentation.pptx) не трогать, пока пользователь не попросит.
Маскот-обезьянка «Бананчик»: функции и классы с префиксом bn (bnHTML, bnSVG, bnApply, bnLife),
журнал занятий в D.jr. Позы заданы в таблице BP, переходы между ними плавные (bnApply).

ЭКОНОМИЯ ЛИМИТА (обязательно)
 - Файл очень большой (около 600 КБ), строки длинные. НИКОГДА не читать его целиком и не выводить длинные строки.
   Сначала искать по метке: grep -n "метка" index.html | cut -c1-160, потом читать только нужные строки:
   sed -n 'от,доp' index.html | cut -c1-300. Номера строк меняются, поэтому искать по меткам из карты ниже.
 - Менять точечно (замена нужного куска), большие блоки не переписывать. Не читать файл заново после правки.
 - Словарь и другие большие данные добавлять одним блоком по готовому шаблону, а не по кусочку.

ПРАВИЛА ОБНОВЛЕНИЙ (каждая новая версия должна ставиться поверх прошлой и не терять прогресс пользователя):
 1. APK подписывается одним и тем же ключом debug.keystore из корня репозитория (сборка копирует его в ~/.android/). Этот файл не удалять, не менять, не пересоздавать.
 2. Имя пакета appId = com.kartochki.app (capacitor.config.json) не менять никогда. Другое имя = другое приложение, прогресс не перенесётся.
 3. Номер версии (versionCode) ставит сборка сама: он равен номеру запуска в GitHub Actions и всегда растёт. Вручную не трогать. Название версии = version из package.json + номер запуска.
 4. Данные пользователя лежат в localStorage 'fc8' (объект D). Ключ 'fc8' не менять. Новые поля D всегда с значением по умолчанию (D.x||значение), чтобы старые сохранения работали. Поля не удалять и не переименовывать без миграции при загрузке.
 5. Перед крупным обновлением напоминать про резервную копию (настройки -> резервная копия).

ПРАВИЛА ПРОИЗВОДИТЕЛЬНОСТИ (обязательно для любых новых анимаций и интерфейса, приложение должно работать на бюджетных телефонах):
 1. Анимировать только transform и opacity. Не анимировать background-position, width/height, top/left, box-shadow, text-shadow, filter.
 2. Не использовать filter: blur и backdrop-filter на прокручиваемых списках и больших или анимированных слоях. Мягкие пятна делать radial-gradient.
 3. Бесконечные анимации (infinite) только если без них нельзя. Новые декоративные добавлять в списки паузы: html.scrl (прокрутка), html.hid (вкладка свёрнута), html.lite (слабый телефон).
 4. Длинные списки: content-visibility:auto и contain-intrinsic-size, либо отрисовка порциями. Не рисовать тысячи элементов сразу.
 5. Не вешать тяжёлые обработчики на scroll/resize и MutationObserver на весь body: только passive, с rAF или задержкой, и только на нужные изменения.
 6. Не читать размеры (clientWidth, scrollWidth) и не менять стили вперемешку в цикле: сначала все чтения, потом все записи.
 7. Учитывать prefers-reduced-motion и облегчённый режим html.lite (меньше частиц, без декоративных анимаций).

КАРТА ФАЙЛА (метка для grep -> что там)
 - <style> ... : все стили. Карточки-разделы: .stack, .top b; названия в одну строку: .fit1.
 - const E=[ : английские слова по уровням A1-C1 (E0..E5).   const SIT=[ : ситуации (S0..S6).
 - const WD=[ : базовые слова (W0..W4), одна строка с ; и |.   const GER= / ZHW= / KOW= : немецкий, китайский, корейский.
 - "расширение словаря" : блоки с добавленными словами (часть 1 и часть 2). Новые слова добавлять сюда, новым блоком.
 - const GAPQ=[ , const TENSEQ=[ , const RCASE=[ , const RVERB=[ : грамматика (тесты).
 - const IC={ : иконки (только SVG).   const S={ : все тексты интерфейса на 3 языках.   Названия разделов: sk_daily, sk_ew.
 - function autoCards , function regen , function ensureSeed , function ensureEW : сборка колод из таблиц слов.
 - const save= , localStorage 'fc8' : сохранение.   bkBad : резервная копия (сохранить/загрузить прогресс).
 - function bnHTML , bnLife , const BP : обезьянка «Бананчик».
 - const PHB , const RTX , const OBS : фразы, тексты для чтения, обучение.
 - const SFX={ : звуки.   const MUS=(()=>{ : фоновая музыка (5 встроенных треков + своя музыка; файлы в IndexedDB 'fcmus',
   список в D.mus.cu; MDB.put/get/del; выбор файлов через input#musF).
 - function go( , function render( : экраны и переходы.   function stack( : карточки-разделы.   function setLang : смена языка.

КАК УСТРОЕНЫ СЛОВА
 - Одна общая таблица на все языки: слово = [английский, русский, туркменский]. Это E (уровни), SIT (ситуации), WD (базовые).
 - Немецкий, китайский и корейский: три отдельные таблицы GER, ZHW, KOW с теми же ключами (E0..E5, S0..S6, W0..W4)
   и в том же порядке: слово номер N в GER[ключ] переводит слово номер N в таблице слов. Пустое место = карточка не показывается.
 - Китайский и корейский пишутся как «слово (чтение)», например «包 (bāo)», «가방 (gabang)».
 - Курсы: английский, русский, немецкий, китайский, корейский берут слова из тех же таблиц. Русский курс использует
   только английский/русский/туркменский столбцы, остальные берут свой перевод из GER/ZHW/KOW.
 - Туркменский неизвестен = оставить пустым (не выдумывать). Такая карточка просто не показывается на туркменском.
 - Добавление слов: новый блок после предыдущего блока «расширение словаря». Строка: en|ru|tk|de|zh (чтение)|ko (чтение).
   Блок сам добавляет слово во все 4 таблицы сразу и пропускает повторы.
 - ВАЖНО: после добавления слов поднять число в строке if(D.lib!==N){...D.lib=N; (grep -n "D.lib"), иначе у тех, кто
   обновил APK, новые слова не появятся. Прогресс при этом сохраняется (карточки совпадают по тексту).

ГОТОВАЯ ПРОВЕРКА (перед отдачей файла)
 Сохранить как check.js в рабочую папку и запустить: node check.js /полный/путь/index.html
 Печатает: ошибки страницы (должно быть пусто), число слов по курсам (должно быть одинаковым), расхождения таблиц (0),
 сохранился ли прогресс при обновлении, работает ли добавление своей музыки.
 ---8<---
 const {chromium}=require('playwright');
 (async()=>{const b=await chromium.launch(),p=await b.newPage(),er=[];
 p.on('pageerror',e=>er.push(e.message));
 await p.goto('file://'+process.argv[2]);await p.waitForTimeout(800);
 const r=await p.evaluate(()=>{const K=[];for(let i=0;i<6;i++)K.push('E'+i);for(let i=0;i<7;i++)K.push('S'+i);for(let i=0;i<5;i++)K.push('W'+i);
  const o={cards:{},bad:0};for(const [n,au] of [['en',0],['ru',1],['de',3],['zh',4],['ko',5]]){o.cards[n]=K.reduce((a,k)=>a+autoCards(au,k).length,0)}
  K.forEach(k=>{const T=k[0]==='W'?WD[+k[1]]:k[0]==='S'?SIT[+k[1]]:E[+k[1]];[GER,ZHW,KOW].forEach(g=>{if(g[k].length!==T.length)o.bad++})});
  const d=D.cats[0].decks[0];d.cards[2].box=3;save();o.f=d.cards[2].f;return o});
 await p.reload();await p.waitForTimeout(800);
 r.progressKept=await p.evaluate(()=>D.cats[0].decks[0].cards[2].box===3);
 r.err=er;console.log(JSON.stringify(r));await b.close()})();
 ---8<---

<html lang="ru" data-th="dark"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Карточки</title>
<style>
:root{--bg:#0e1226;--card:#171b38;--line:#2b3060;--ink:#eef0ff;--mute:#a3a8d0;--acc:#9b8cff;--go:#5ee0c0;--gof:#0e1226;--hero:linear-gradient(135deg,#2a2f66,#1a1e40);--herob:#363c80}
:root[data-th=light]{--bg:#f2f3fb;--card:#fff;--line:#d9dcf1;--ink:#14173a;--mute:#585d8c;--acc:#5a45e0;--go:#0b8a6c;--gof:#fff;--hero:linear-gradient(135deg,#e4e7ff,#d3d8ff);--herob:#bcc3f5}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{overflow-x:hidden;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:20px 18px 48px;max-width:520px;margin:auto}
h1{font-size:clamp(24px,8vw,32px);line-height:1.08;margin:4px 0 8px;font-weight:800;letter-spacing:-.5px;overflow-wrap:anywhere;hyphens:auto}
h2{font-size:19px;margin:0 0 12px;font-weight:800}
p{margin:0 0 12px}
.mute{color:var(--mute);font-size:14px}
button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:14px 16px;background:var(--go);color:var(--gof)}
button.g{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.w{width:100%}
button:disabled{opacity:.4}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:10px}
input:focus,textarea:focus{outline:2px solid var(--acc);border-color:transparent}
.dots{width:44px;height:44px;border-radius:50%;padding:0;display:grid;place-items:center;font-size:24px;line-height:1;background:transparent;color:var(--ink);border:1px solid var(--line)}
.anch{position:relative}
.bd{position:fixed;inset:0;z-index:6}
.pop{position:absolute;right:0;top:52px;width:250px;z-index:7;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px 14px;box-shadow:0 12px 32px rgba(0,0,0,.4)}
.pop .it:first-child{border-top:0}
.it{display:flex;align-items:center;gap:14px;width:100%;padding:11px 2px;font-size:15px;background:none;color:var(--ink);border:0;border-top:1px solid var(--line);border-radius:0;text-align:left;font-weight:600}
.it span{flex:none;font-size:18px;width:22px;text-align:center;display:grid;place-items:center}
.it small{margin-left:auto;color:var(--mute);font-weight:500;font-size:13px;white-space:nowrap;flex:none;padding-left:14px}
.it{white-space:nowrap;gap:10px}
.bar0{position:relative;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.hero{background:var(--hero);border:1px solid var(--herob);border-radius:24px;padding:22px;margin-bottom:26px}
.hero .n{font-size:58px;font-weight:800;line-height:1}
.hero .mute{margin:4px 0 16px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 22px;padding:0 14px 14px 0;margin-bottom:18px}
.stack{position:relative;min-width:0}
.stack i{position:absolute;inset:0;border-radius:18px;background:var(--c)}
.stack i:nth-child(1){transform:translate(14px,14px) rotate(3deg);filter:brightness(.6)}
.stack i:nth-child(2){transform:translate(7px,7px) rotate(1.5deg);filter:brightness(.8)}
.top{position:relative;width:100%;min-height:172px;border-radius:18px;padding:15px;background:var(--c);color:#fff;border:1px solid rgba(255,255,255,.25);text-align:left;display:flex;flex-direction:column;justify-content:space-between;font-weight:500}
.top{min-width:0}
.top b.fit1{white-space:nowrap;overflow-wrap:normal;hyphens:manual;-webkit-hyphens:manual}
.top b{font-size:clamp(14px,4.3vw,19px);line-height:1.15;font-weight:800;display:block;overflow-wrap:anywhere;hyphens:auto;-webkit-hyphens:auto}
.top small{font-size:13px;opacity:.92;display:block;margin-top:6px}
.tag{white-space:nowrap;display:inline-block;background:#5ee0c0;color:#0e1226;border-radius:8px;padding:2px 9px;font-weight:800;font-size:13px}
.pg{height:5px;border-radius:3px;background:rgba(255,255,255,.28);margin-top:10px}
.pg u{display:block;height:100%;background:#fff;border-radius:3px}
.new{min-width:0;position:relative;min-height:172px;border-radius:18px;border:2px dashed var(--line);background:transparent;color:var(--mute);display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;font-weight:600}
.new i{font-style:normal;font-size:36px;line-height:1;color:var(--ink)}
.box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px}
.row{display:flex;gap:10px}.row>*{flex:1}
.head{border-radius:24px;padding:18px;color:#fff;background:var(--c);margin-bottom:22px}
.head h1{margin-top:12px}
.head .bk{background:rgba(255,255,255,.22);color:#fff;padding:8px 14px}
.stats{display:flex;gap:8px;margin:14px 0}
.stats div{flex:1;background:rgba(255,255,255,.18);border-radius:12px;padding:8px 10px;font-size:13px}
.stats b{display:block;font-size:22px}
.start{background:#5ee0c0;color:#0e1226}
.cd{border-top:1px solid var(--line)}
.cd:first-of-type{border-top:0}
.cd summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:13px 0;cursor:pointer}
.cd summary::-webkit-details-marker{display:none}
.cd summary::after{content:"\203A";font-size:24px;color:var(--mute);transition:transform .2s}
.cd[open] summary::after{transform:rotate(90deg)}
.cd .ar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 0 13px;color:var(--acc);font-weight:700}
.sbar{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.sbar .x{padding:8px 13px}
.bar{flex:1;height:8px;background:var(--line);border-radius:4px}
.bar i{display:block;height:100%;background:var(--c);border-radius:4px;transition:width .3s}
.scene{position:relative;z-index:0;height:340px;margin-bottom:38px}
.card{position:relative;height:100%;transform-style:preserve-3d;transition:transform .5s}
.card.f{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:26px;padding:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:27px;font-weight:800;line-height:1.2;word-break:break-word}
.face .zh{font-size:34px;line-height:1.15}.face .py{font-size:17px;font-weight:700;color:var(--ink);opacity:.82;margin:2px 0 12px}

/* плашка-подсказка снизу: стиль карточек приложения, иконка слева */
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 76px);z-index:9000;display:flex;align-items:center;gap:10px;width:max-content;max-width:min(92vw,420px);box-sizing:border-box;padding:10px 16px 10px 12px;border-radius:16px;background:var(--card);background:color-mix(in srgb,color-mix(in srgb,var(--card) 92%,var(--acc)) 86%,transparent);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);border:1px solid var(--line);box-shadow:0 10px 28px rgba(0,0,0,.32),0 1px 0 rgba(255,255,255,.06) inset;color:var(--ink);font-weight:700;font-size:14.5px;line-height:1.3;text-align:left;overflow-wrap:anywhere;text-wrap:balance;opacity:0;visibility:hidden;transform:translate(-50%,14px) scale(.97);transition:opacity .25s,transform .3s cubic-bezier(.2,1.1,.3,1),visibility 0s .3s;pointer-events:none}
#toast.on{opacity:1;visibility:visible;transform:translate(-50%,0) scale(1);transition-delay:0s}
#toast .ti{flex:none;width:24px;height:24px;display:grid;place-items:center}#toast .ti svg{width:24px;height:24px;display:block}

/* ===== производительность: всё новое делать сразу так ===== */
.cd{content-visibility:auto;contain-intrinsic-size:auto 52px}
/* пауза бесконечных декоративных анимаций: при прокрутке (scrl), в свёрнутой вкладке (hid) */

.wrf{min-height:58px;margin:10px 0 12px;font-size:22px;font-weight:700;text-align:center;display:flex;flex-direction:column;justify-content:center}
.wrf.ok{color:var(--go)}.wrf.no{color:var(--no,#e04848)}
.wrf small{font-size:14px;font-weight:400;color:var(--mute)}
.sb{display:inline-flex;align-items:center;justify-content:center;gap:8px}
.lgb{padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.1}
.lgb span{font-size:24px}.lgb small{font-size:12px;font-weight:700}
.gearI svg{animation:spinIn .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes spinIn{from{transform:rotate(-120deg) scale(.6);opacity:0}to{transform:none;opacity:1}}
/* onboarding */
.ob{min-height:calc(100svh - 70px);display:flex;flex-direction:column}
.obt{display:flex;justify-content:space-between;align-items:center;min-height:48px;gap:10px}
.obl{display:flex;gap:8px}
.obl button{padding:8px 12px;font-size:16px;border-radius:12px}
.ob{position:relative;z-index:1}
#obbg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;--oc:var(--acc)}
#obbg i{position:absolute;border-radius:50%;background:radial-gradient(closest-side,var(--oc),transparent);opacity:.22}
#obbg i:nth-child(1){width:300px;height:300px;left:-90px;top:-70px;animation:obDrift 13s ease-in-out infinite alternate}
#obbg i:nth-child(2){width:260px;height:260px;right:-100px;bottom:-60px;opacity:.16;animation:obDrift 17s ease-in-out infinite alternate-reverse}
@keyframes obDrift{from{transform:translate(0,0) scale(1)}to{transform:translate(40px,30px) scale(1.18)}}
.obs{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:10px 6px;position:relative}
.obs>*{animation:obUp .6s cubic-bezier(.2,.8,.2,1) both}
.obs[data-d=f]>.obi{animation-name:obInR}.obs[data-d=b]>.obi{animation-name:obInL}
.obs>*:nth-child(2){animation-delay:.08s}.obs>*:nth-child(3){animation-delay:.16s}.obs>*:nth-child(4){animation-delay:.24s}
@keyframes obUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes obInR{from{opacity:0;transform:translateX(70px) scale(.7) rotate(8deg)}to{opacity:1;transform:none}}
@keyframes obInL{from{opacity:0;transform:translateX(-70px) scale(.7) rotate(-8deg)}to{opacity:1;transform:none}}
.obi{position:relative;width:164px;height:164px;border-radius:50px;background:var(--hero);border:1px solid var(--herob);display:grid;place-items:center;margin-bottom:18px;box-shadow:0 22px 56px -16px var(--oc)}
.obi::before{content:"";position:absolute;inset:-20px;border-radius:66px;border:2px dashed var(--oc);opacity:.4;animation:obSpin 26s linear infinite}
.obi::after{content:"";position:absolute;inset:0;border-radius:inherit;border:2px solid var(--oc);animation:obPulse 2.6s ease-out infinite}
@keyframes obSpin{to{transform:rotate(360deg)}}
@keyframes obPulse{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.32);opacity:0}}
.obi>svg{position:relative;z-index:1;animation:bump .7s .1s both,obBob 3.4s 1s ease-in-out infinite}
@keyframes obBob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-7px) rotate(3deg)}}
.obi b{position:absolute;z-index:2;width:46px;height:46px;border-radius:15px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;box-shadow:0 8px 20px rgba(0,0,0,.25);animation:obFloat 3.2s ease-in-out infinite}
.obi b:nth-of-type(1){top:-16px;right:-22px}
.obi b:nth-of-type(2){bottom:10px;left:-30px;animation-delay:-1.1s}
.obi b:nth-of-type(3){bottom:-20px;right:6px;animation-delay:-2.1s}
@keyframes obFloat{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-8px) rotate(4deg)}}
.obs h1{margin:0}
.obs p{max-width:340px;font-size:17px;color:var(--mute);margin:0}
.obp{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:6px;max-width:360px}
.obp>span{display:inline-flex;align-items:center;gap:6px;padding:6px 12px 6px 8px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13.5px;font-weight:700;animation:obUp .55s cubic-bezier(.2,.8,.2,1) both}
.obp svg{flex:none}
.obd{display:flex;justify-content:center;gap:8px;margin:18px 0}
.obd i{width:8px;height:8px;border-radius:4px;background:var(--line)}
.obd i.on{width:26px;background:var(--oc,var(--acc));animation:obDot .4s cubic-bezier(.2,.8,.2,1)}
@keyframes obDot{from{width:8px}to{width:26px}}
.ob>button.w{animation:obUp .5s .3s cubic-bezier(.2,.8,.2,1) both}
.ob>button.w.fin{animation:obUp .5s .3s cubic-bezier(.2,.8,.2,1) both,obGlow 2s 1s ease-in-out infinite}
@keyframes obGlow{0%,100%{box-shadow:0 0 0 0 rgba(94,224,192,.5)}50%{box-shadow:0 0 0 10px rgba(94,224,192,0)}}
.obcf{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.obcf i{position:absolute;top:30%;left:50%;width:9px;height:14px;border-radius:3px;opacity:0;animation:obConf 1.6s cubic-bezier(.2,.7,.3,1) both}
@keyframes obConf{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r))}}

/* v32: компактнее и мягче */
body{font-size:15px;padding:16px 16px 40px;max-width:480px}
h1{font-size:clamp(20px,6.4vw,26px);margin:2px 0 6px;letter-spacing:-.3px}
h2{font-size:16px;margin:0 0 10px}
p{margin:0 0 10px}
.mute{font-size:13px}
button{padding:11px 14px;border-radius:12px;font-weight:600;transition:transform .18s ease,opacity .2s,background-color .3s,box-shadow .2s}
.ans button{padding:18px;font-size:18px;font-weight:700}
.ans .no{background:rgba(255,122,122,.16);color:#ff8f8f;border:2px solid rgba(255,122,122,.45)}
:root[data-th=light] .ans .no{background:rgba(214,69,69,.1);color:#c93a3a;border-color:rgba(214,69,69,.4)}
input,textarea{padding:11px;border-radius:12px}
.bar0{margin-bottom:8px}
.dots{width:40px;height:40px}
.hero{padding:16px;border-radius:22px;margin-bottom:18px;box-shadow:0 8px 24px rgba(0,0,0,.16)}
.hero .n{font-size:44px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:14px}
.hl{min-width:0;flex:1}
.hl .mute{margin:2px 0 12px}
.hl button{padding:10px 20px}
.rg{flex:none;width:92px;height:92px;padding:0;background:transparent;border-radius:50%}
.rg svg{display:block}
.spc{padding:11px 14px;margin:-4px 0 16px;border-radius:18px}
.spc .spi{width:44px;height:44px;border-radius:14px}
.spc b{font-size:15px}
.grid{gap:20px 16px;padding:0 10px 10px 0;margin-bottom:14px}
.top{min-height:124px;padding:12px;border-radius:16px;box-shadow:0 6px 16px rgba(0,0,0,.16)}
.top small{font-size:12px}
.tag{font-size:12px;padding:1px 8px}
.stack i{border-radius:16px}
.stack i:nth-child(1){transform:translate(10px,10px) rotate(2deg)}
.stack i:nth-child(2){transform:translate(5px,5px) rotate(1deg)}
.new{min-height:124px;border-radius:16px}
.box{padding:14px;border-radius:18px;margin-bottom:12px}
.head{padding:14px;border-radius:22px;margin-bottom:16px}
.stats b{font-size:19px}
.scene{height:290px;margin-bottom:34px}
.face{font-size:24px;padding:20px;border-radius:24px}
.card{transition:transform .65s cubic-bezier(.3,.7,.2,1)}
.qs{font-size:clamp(20px,6vw,26px)}
.opt{min-height:62px;font-size:16px}
.acts{display:flex;gap:8px;flex:none}
.eb{display:inline-block;background:#ff7a7a;color:#fff;border-radius:6px;font-size:11px;font-weight:800;padding:0 6px;margin-left:4px}
.cd.ed{padding:12px 0}

/* ===== Объёмные кнопки ===== */
html:root{--ge:#070a1c;--hl:rgba(255,255,255,.38);--hg:rgba(255,255,255,.10);--sh:rgba(0,0,0,.38);--yes:#34d399;--no:#ff6b6b;--yt:#053b2c;--nt:#4a0d0d}
html:root[data-th=light]{--ge:#b3b9e2;--hl:rgba(255,255,255,.75);--hg:#fff;--sh:rgba(40,50,120,.28);--yes:#12a874;--no:#e04848;--yt:#fff;--nt:#fff}
/* основа: цветная выпуклая кнопка */
html:root button{
  --b:var(--go);--e:rgba(0,0,0,.38);
  background-color:var(--b);
  background-image:linear-gradient(180deg,rgba(255,255,255,.32) 0,rgba(255,255,255,.08) 48%,rgba(0,0,0,.07) 100%);
  border:0;
  box-shadow:0 4px 0 var(--e),0 10px 14px -4px var(--sh),inset 0 1.5px 0 var(--hl),inset 0 -2px 0 rgba(0,0,0,.10);
  transition:transform .12s ease,box-shadow .12s ease,opacity .2s,background-color .3s}
@supports (background-color:color-mix(in srgb,red 50%,blue)){
html:root button{--e:color-mix(in srgb,var(--b) 58%,#000)}
}
html:root button:active:not(:disabled){
  transform:translateY(4px);
  box-shadow:0 0 0 var(--e),0 2px 4px -2px var(--sh),inset 0 1.5px 0 var(--hl),inset 0 -2px 0 rgba(0,0,0,.10)}
html:root button:disabled{box-shadow:0 4px 0 var(--e),inset 0 1.5px 0 var(--hl),inset 0 -2px 0 rgba(0,0,0,.10)}
/* место под нижнюю грань */
html:root .w,html:root .row>button,html:root .ans button{margin-bottom:4px}

/* нейтральные: «карточные» кнопки */
html:root .g,html:root .dots,html:root .opt,html:root .pal,html:root .spc{
  --b:var(--card);--e:var(--ge);--hl:var(--hg);
  background-color:var(--card);color:var(--ink);
  background-image:linear-gradient(180deg,rgba(255,255,255,.08) 0,rgba(255,255,255,0) 60%);
  border:1.5px solid var(--line)}
html:root .pal.on,html:root .g.on{border-color:var(--acc)}
html:root .spk{
  --e:var(--ge);--hl:var(--hg);color:var(--ink);
  background-image:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,0)),var(--hero);
  border:1.5px solid var(--herob)}

/* варианты ответов в квизе */
html:root .opt.ok{--e:#17917a;border-color:var(--yes);background-color:rgba(94,224,192,.18);background-color:color-mix(in srgb,var(--yes) 24%,var(--card))}
html:root .opt.bad{--e:#b83a3a;border-color:var(--no);background-color:rgba(255,122,122,.18);background-color:color-mix(in srgb,var(--no) 24%,var(--card))}

/* цветные */
html:root .start{--b:#5ee0c0;--e:#2d9e84;color:#0e1226}
html:root .head .bk{background-color:rgba(255,255,255,.26);--e:rgba(0,0,0,.28);color:#fff}
html:root .ans button{--b:var(--yes);--e:rgba(0,0,0,.28);color:var(--yt);border:0}
html:root .ans .no{--b:var(--no);background-color:var(--no);color:var(--nt);border:0}
@supports (background-color:color-mix(in srgb,red 50%,blue)){
html:root .ans button{--e:color-mix(in srgb,var(--yes) 58%,#000)}
html:root .ans .no{--e:color-mix(in srgb,var(--no) 58%,#000)}
}

/* колоды-карточки: объём внутри, стопка остаётся */
html:root .top{
  --e:rgba(0,0,0,.25);
  box-shadow:0 10px 18px -6px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.4),inset 0 -5px 0 rgba(0,0,0,.2);
  transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .2s,background-color .35s}
html:root .top{--b:var(--c);background-color:var(--c);color:#fff}
html:root .stack:active .top{
  transform:translateY(-5px) scale(1.03);
  box-shadow:0 16px 24px -6px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.4),inset 0 -5px 0 rgba(0,0,0,.2)}

/* кнопка «+ новая» — плоская, пунктир */
html:root .new{background-color:transparent;background-image:none;box-shadow:none;border:2px dashed var(--line);color:var(--mute)}
html:root .new:active:not(:disabled){transform:scale(.96);box-shadow:none}

/* кружки палитры — шарики */
html:root .pc{
  background-color:var(--a);
  background-image:radial-gradient(circle at 32% 26%,rgba(255,255,255,.7) 0,rgba(255,255,255,0) 48%),linear-gradient(180deg,rgba(255,255,255,0) 50%,rgba(0,0,0,.24));
  border:3px solid var(--card);
  box-shadow:0 0 0 1.5px var(--line),0 5px 8px -1px var(--sh),inset 0 -4px 6px rgba(0,0,0,.22)}
html:root .pc.on{box-shadow:0 0 0 3px var(--ink),0 5px 8px -1px var(--sh),inset 0 -4px 6px rgba(0,0,0,.22)}
html:root .pc:active:not(:disabled){transform:scale(.92);box-shadow:0 0 0 1.5px var(--line),inset 0 -4px 6px rgba(0,0,0,.22)}

/* не кнопки по виду: строки меню и кольцо цели */
html:root .it,html:root .rg{background:none;background-color:transparent;box-shadow:none}
html:root .it{border:0;border-top:1px solid var(--line);color:var(--ink)}
html:root .pop .it:first-child{border-top:0}
html:root .it:active:not(:disabled),html:root .rg:active:not(:disabled){transform:none;box-shadow:none;opacity:.6}

/* ===== анимации: пружинные кнопки, переходы между экранами, смена языка ===== */
button{transition:transform .55s cubic-bezier(.34,1.56,.64,1),box-shadow .28s,opacity .2s,background-color .3s,filter .2s!important}
button:active:not(:disabled){transform:scale(.92);transition-duration:.07s,.07s,.2s,.3s,.2s!important}
html:root button:active:not(:disabled){transform:translateY(4px) scale(.97)}
.stack:active .top{transition:transform .12s cubic-bezier(.2,.8,.2,1),box-shadow .12s!important}
.stack .top{transition:transform .5s cubic-bezier(.34,1.56,.64,1),box-shadow .3s,background-color .35s!important}
.tap{position:fixed;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--acc);opacity:.42;pointer-events:none;z-index:9999;animation:tapR .6s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes tapR{to{transform:scale(6.5);opacity:0}}
#app.out{opacity:0;transform:translateY(10px) scale(.985);filter:blur(6px);transition:opacity .17s ease-in,transform .17s ease-in,filter .17s ease-in}
@keyframes slideF{from{opacity:0;transform:translateX(34px) scale(.98)}to{opacity:1;transform:none}}
@keyframes slideB{from{opacity:0;transform:translateX(-34px) scale(.98)}to{opacity:1;transform:none}}
#app[data-dir=fwd].enter>*:not(.grid){animation-name:slideF;animation-duration:.55s}
#app[data-dir=back].enter>*:not(.grid){animation-name:slideB;animation-duration:.55s}
.lgb:not(.g),.pal.on,.pc.on{animation:bump .55s cubic-bezier(.34,1.56,.64,1)}
.swrow input::after{transition:transform .35s cubic-bezier(.34,1.56,.64,1),width .2s,background .25s}
.swrow input:active::after{width:30px}
.swrow input:checked:active::after{transform:translateX(15px)}
.crs button{transition:transform .5s cubic-bezier(.34,1.56,.64,1)!important}
/* ===== плавное исчезновение: кнопки ответа, экраны, финиш ===== */
.ans{transform:translateY(16px) scale(.96);transition:opacity .25s,transform .5s cubic-bezier(.34,1.56,.64,1)}
.ans.show{transform:none}
.ans.hide{opacity:0;transform:translateY(24px) scale(.92);pointer-events:none;transition:opacity .2s ease-in,transform .26s ease-in}
.ans.show button:nth-child(1){animation:popBtn .55s cubic-bezier(.34,1.56,.64,1) backwards}
.ans.show button:nth-child(2){animation:popBtn .55s .08s cubic-bezier(.34,1.56,.64,1) backwards}
@keyframes popBtn{from{opacity:0;transform:scale(.7) translateY(16px)}to{opacity:1;transform:none}}
.bar i{transition:width .55s cubic-bezier(.22,1,.36,1)!important}
.ghost{margin:0!important;pointer-events:none;overflow:hidden;z-index:50;box-sizing:border-box;animation:ghostOut .28s cubic-bezier(.4,0,.9,.5) forwards}
@keyframes ghostOut{to{opacity:0;transform:translateX(var(--gx,-28px)) scale(.97);filter:blur(4px)}}
.done{animation:fadeIn .35s}
.done>*{animation:rise .65s cubic-bezier(.2,.8,.2,1) backwards}
.done h1{animation:bump .7s cubic-bezier(.34,1.56,.64,1) .05s both}
.done p{animation-delay:.2s}.done button{animation-delay:.34s}
/* ===== анимация закрытия плашек и раскрывающихся блоков ===== */
.pop.closing{animation:popOut .18s cubic-bezier(.4,0,1,1) forwards;pointer-events:none}
@keyframes popOut{to{opacity:0;transform:scale(.86) translateY(-8px)}}
details[open]>summary~*{animation:dtOpen .32s cubic-bezier(.2,.8,.2,1)}
@keyframes dtOpen{from{opacity:0;transform:translateY(-8px)}}
details>summary::after{transition:transform .3s cubic-bezier(.34,1.56,.64,1)!important}
/* ===== тест уровня ===== */
.qs .zh{font-size:46px;line-height:1.2}.qs .py{font-size:18px;font-weight:700;opacity:.8;margin-top:4px}
.lvres{text-align:center;padding:26px 6px}
.lvbig{font-size:88px;font-weight:900;line-height:1;margin:12px 0 8px;color:var(--acc);animation:bump .8s cubic-bezier(.34,1.56,.64,1) both}
.lvd{font-size:18px;font-weight:600;margin:4px 0 22px;animation:rise .6s .2s cubic-bezier(.2,.8,.2,1) backwards}
.lvs{display:flex;gap:6px;margin:0 0 16px}
.lvs i{flex:1;height:46px;border-radius:12px;background:var(--line);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800;color:var(--mute);animation:rise .5s cubic-bezier(.34,1.56,.64,1) backwards;animation-delay:var(--d)}
.lvs i.on{background:var(--acc);color:var(--bg)}
.lvres .note{font-size:13px;margin:6px 0 20px}
/* ===== значок ✓/✕ у вариантов ответа: в углу, не поверх текста ===== */
.opt i,.opts .opt i{top:-10px;right:-8px;width:26px;height:26px;border-radius:50%;font-size:14px;border:2px solid var(--bg);box-shadow:0 3px 8px rgba(0,0,0,.35);z-index:3;animation:bump .45s cubic-bezier(.34,1.56,.64,1) both}
.opt.ok i{background:#1fae8c}.opt.bad i{background:#ff5d5d}
/* ===== мини-игра «Найди пару» ===== */
.mgi{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:18px;margin:14px 2px 0}
.mgi #mgc{color:var(--go);animation:bump .4s cubic-bezier(.34,1.56,.64,1)}
.mgrid{display:grid;grid-template-columns:repeat(var(--cols,3),1fr);gap:10px;margin-top:12px}
.mt{min-height:78px;padding:8px 6px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-align:center;background:var(--card);color:var(--ink);border:1.5px solid var(--line);font-weight:800;line-height:1.15;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;transition:transform .3s cubic-bezier(.34,1.56,.64,1),background-color .2s,border-color .2s,box-shadow .2s;animation:rise .45s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--k)*.035s)}
.mt .mw{font-size:clamp(13px,3.8vw,17px);overflow-wrap:anywhere}
.mt .mp{font-size:11px;font-weight:700;opacity:.72}
.mt:active{transform:scale(.94)}
.mt.sel{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 18%,var(--card));transform:scale(1.06);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 35%,transparent)}
.mt.ok{border-color:var(--go);background:rgba(94,224,192,.2);animation:mtOk .55s cubic-bezier(.4,0,.2,1) .1s forwards;pointer-events:none}
.mt.no{border-color:#ff7a7a;background:rgba(255,122,122,.16)}
.mt.gone{visibility:hidden;pointer-events:none}
@keyframes mtOk{0%{transform:scale(1.08)}35%{transform:scale(1.16)}100%{transform:scale(.3);opacity:0}}
.mgst{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:0 0 18px}
.mgst>span{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:800;animation:rise .5s cubic-bezier(.34,1.56,.64,1) backwards}
.mgst>span:nth-child(2){animation-delay:.1s}.mgst>span:nth-child(3){animation-delay:.2s}
/* ===== «Найди пару»: оформление плиток ===== */
.mgrid{gap:12px;margin-top:14px}
.mt{min-height:86px;padding:10px 6px;border-radius:18px;border:1.5px solid color-mix(in srgb,var(--acc) 38%,var(--line));background:linear-gradient(155deg,color-mix(in srgb,var(--acc) 20%,var(--card)),var(--card) 70%);box-shadow:0 4px 0 color-mix(in srgb,var(--acc) 30%,#000),0 8px 16px rgba(0,0,0,.22)}
.mt[data-s="1"]{border-color:color-mix(in srgb,var(--go) 40%,var(--line));background:linear-gradient(155deg,color-mix(in srgb,var(--go) 18%,var(--card)),var(--card) 70%);box-shadow:0 4px 0 color-mix(in srgb,var(--go) 30%,#000),0 8px 16px rgba(0,0,0,.22)}
.mt .mw{overflow-wrap:break-word;word-break:normal;hyphens:manual;font-size:16px;letter-spacing:.1px}
.mt:active{transform:translateY(3px) scale(.97);box-shadow:0 1px 0 color-mix(in srgb,var(--acc) 30%,#000)}

/* ===== «Найди пару» в стиле соединения линиями ===== */
.mgwrap{position:relative;display:grid;grid-template-columns:1fr 1fr;column-gap:58px;margin-top:16px}

.mgsvg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:3}
.mgwrap .mt{position:relative;min-height:var(--mh,64px);flex:1}

.mt[data-s="1"]::before{left:-6px;background:var(--go)}
.mt.sel{transform:none!important;border-color:var(--acc);box-shadow:0 0 0 1.5px color-mix(in srgb,var(--acc) 70%,transparent),0 0 18px color-mix(in srgb,var(--acc) 42%,transparent),0 4px 0 color-mix(in srgb,var(--acc) 30%,#000)}
.mt[data-s="1"].sel{border-color:var(--go);box-shadow:0 0 0 1.5px color-mix(in srgb,var(--go) 70%,transparent),0 0 18px color-mix(in srgb,var(--go) 42%,transparent),0 4px 0 color-mix(in srgb,var(--go) 30%,#000)}
.mt.ok{border-color:var(--go);background:rgba(94,224,192,.2);animation:mtOk2 .5s cubic-bezier(.4,0,.2,1) .42s forwards;pointer-events:none}
@keyframes mtOk2{0%{transform:scale(1);opacity:1}30%{transform:scale(1.07)}100%{transform:scale(.6);opacity:0}}
.mt.no{border-color:#ff7a7a;background:rgba(255,122,122,.16)}
@keyframes mgShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.mgl{fill:none;stroke-width:5;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:mgDraw .36s cubic-bezier(.4,0,.2,1) forwards;filter:drop-shadow(0 0 5px var(--lc))}
.mgl.ok{stroke:var(--go);--lc:rgba(94,224,192,.75)}

@keyframes mgOut{from{stroke-dashoffset:0;opacity:1}to{stroke-dashoffset:0;opacity:0}}
.mt.no,.mt[data-s="1"].no{border-color:#ff6b6b;background:linear-gradient(155deg,rgba(255,107,107,.26),rgba(255,107,107,.1));box-shadow:0 0 0 1.5px rgba(255,107,107,.55),0 0 16px rgba(255,107,107,.3),0 4px 0 #8a2f38}
.mt.no::before,.mt.no::after{background:#ff6b6b!important}
.spk.lsbtn{position:relative;top:auto;right:auto;width:92px;height:92px;margin:6px auto 10px;animation:lsPulse 1.9s ease-in-out infinite}
@keyframes lsPulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--acc) 38%,transparent)}50%{box-shadow:0 0 0 14px transparent}}
.achs{gap:10px}
.lsl{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:left}

.lsc small{align-self:flex-start;text-align:left}
.lsl .lsc:last-child{align-items:stretch}
.mgwrap{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.mgcol{min-width:0}
.mt .mw{display:block;max-width:100%;overflow-wrap:normal;word-break:normal}

/* ===== v48: статистика, резервная копия, поиск ===== */
.bgrp{display:flex;align-items:center;gap:8px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 10px;text-align:center;min-width:0;animation:tileIn .5s cubic-bezier(.2,.8,.2,1) both}
.tile:nth-child(2){animation-delay:.05s}.tile:nth-child(3){animation-delay:.1s}.tile:nth-child(4){animation-delay:.15s}.tile:nth-child(5){animation-delay:.2s}.tile:nth-child(6){animation-delay:.25s}
.tile b{display:block;font-size:24px;line-height:1.15;color:var(--ink)}
.tile small{display:block;margin-top:3px;font-size:11px;line-height:1.25;color:var(--mute)}
@keyframes tileIn{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
.seg{display:flex;gap:6px;margin:4px 0 6px}.seg button{flex:none;padding:6px 14px;font-size:13px;border-radius:999px}
.chart.tall{height:150px}.chart.dense{gap:3px}.chart.dense span{font-size:9px;white-space:nowrap}

.prg{margin:10px 0}.prg>div:first-child{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}.prg small{color:var(--mute)}
.pbar{height:9px;border-radius:5px;background:var(--line);overflow:hidden}.pbar i{display:block;height:100%;border-radius:5px;background:var(--acc);transform-origin:left;animation:growX .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes growX{from{transform:scaleX(0)}to{transform:none}}
.hard{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:none;color:var(--ink);border:0;border-top:1px solid var(--line);border-radius:0;padding:10px 2px}
.hard:first-of-type{border-top:0}.hard b{font-size:15px}.hard small{display:block;color:var(--mute);font-size:12px;margin-top:2px}.hard span{color:var(--acc);font-weight:700;text-align:right;max-width:45%}
.hmsel{min-height:18px;margin:6px 0 0}
.srr{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.srr b{display:block;font-size:15px}.srr span{display:block;color:var(--acc);font-weight:600;margin-top:2px}.srr small{display:block;color:var(--mute);font-size:12px;margin-top:3px}
.srr mark{background:var(--acc);color:var(--bg);border-radius:4px;padding:0 2px}
.srh{font-size:13px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 8px;font-weight:700}
@media (prefers-reduced-motion:reduce){.tile,.pbar i{animation:none}}
html:root .srr{--b:var(--card);--e:var(--ge);--hl:var(--hg);background-color:var(--card);color:var(--ink);background-image:linear-gradient(180deg,rgba(255,255,255,.08) 0,rgba(255,255,255,0) 60%);border:1.5px solid var(--line);margin-bottom:12px}
html:root .hard{background:none;box-shadow:none;border:0;border-top:1px solid var(--line);border-radius:0;color:var(--ink)}
html:root .hard:first-of-type{border-top:0}
html:root .hard:active:not(:disabled){transform:none;box-shadow:none;background-color:var(--line)}


/* ===== v49: напоминание ===== */
.remb{display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--acc);border-radius:18px;padding:12px 14px;margin-bottom:16px;font-size:14px;animation:tileIn .5s cubic-bezier(.2,.8,.2,1) both}
.remb b{display:block;font-size:15px;margin-bottom:2px}.remb span{color:var(--mute)}
.remb i{flex:none;display:grid;place-items:center;animation:bell 2.4s ease-in-out infinite;transform-origin:50% 10%}
@keyframes bell{0%,60%,100%{transform:rotate(0)}66%{transform:rotate(14deg)}72%{transform:rotate(-12deg)}78%{transform:rotate(8deg)}84%{transform:rotate(-5deg)}90%{transform:rotate(0)}}
@media (prefers-reduced-motion:reduce){.remb i{animation:none}}

/* v50: живой интерфейс (в стиле приветствия) */
#amb{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
#amb i{position:absolute;border-radius:50%;background:radial-gradient(closest-side,var(--c,var(--acc)),transparent);opacity:.14}
#amb i:nth-child(1){width:320px;height:320px;left:-110px;top:-90px;animation:ambD 15s ease-in-out infinite alternate}
#amb i:nth-child(2){width:280px;height:280px;right:-110px;top:38%;--c:var(--go);opacity:.09;animation:ambD 19s ease-in-out infinite alternate-reverse}
#amb i:nth-child(3){width:300px;height:300px;left:10%;bottom:-130px;opacity:.11;animation:ambD 22s ease-in-out infinite alternate}
@keyframes ambD{from{transform:translate(0,0) scale(1)}to{transform:translate(50px,40px) scale(1.2)}}
@keyframes sheen{0%,55%{background-position:160% 0}100%{background-position:-60% 0}}
@keyframes sheenOnce{from{background-position:160% 0}to{background-position:-60% 0}}
@keyframes glowP{0%,100%{transform:scale(.85);opacity:.55}50%{transform:scale(1.15);opacity:1}}
@keyframes barShine{from{background-position:-80px 0}to{background-position:320px 0}}
@keyframes popIt{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
@keyframes rip{to{transform:scale(1);opacity:0}}
.hero{position:relative;box-shadow:0 22px 54px -24px var(--acc)}
.hero::before,.head::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.2) 50%,transparent 65%);background-size:250% 100%;animation:sheen 6s ease-in-out infinite}
.head{position:relative}
.hero button:not(.g),.start,button.w:not(.g):not(:disabled){background-image:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.32) 50%,transparent 65%);background-size:250% 100%;background-repeat:no-repeat;animation:sheen 4.2s ease-in-out infinite}
#app .ob>button.w{animation:obUp .5s .3s cubic-bezier(.2,.8,.2,1) both,sheen 4.2s 1s ease-in-out infinite}
#app .ob>button.w.fin{animation:obUp .5s .3s cubic-bezier(.2,.8,.2,1) both,sheen 4.2s 1s ease-in-out infinite,obGlow 2s 1s ease-in-out infinite}
.top{box-shadow:0 18px 32px -20px var(--c)}
.top::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.3) 50%,transparent 62%);background-size:260% 100%;background-position:160% 0;animation:sheenOnce 1.3s .6s ease both}
.stack:active .top::before{animation:sheenOnce .7s ease both}
.face{box-shadow:0 28px 60px -30px var(--c)}
.bar i,.sptb i:not(.low){background-image:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);background-size:80px 100%;background-repeat:no-repeat;animation:barShine 1.9s linear infinite}
.streakbox{position:relative}
.streakbox::before{content:"";position:absolute;left:50%;top:14px;width:160px;height:160px;margin-left:-80px;border-radius:50%;background:radial-gradient(circle,rgba(255,138,76,.45),transparent 66%);animation:glowP 2.6s ease-in-out infinite;pointer-events:none}
.ach.on{box-shadow:0 16px 30px -20px var(--acc)}
.ach.on .bdg{animation:obFloat 3.6s ease-in-out infinite}
#app.enter h1>svg{animation:bump .7s .1s both}
#app.enter>*:nth-child(n+6){animation-delay:.26s}
.pop .it{animation:popIt .32s cubic-bezier(.2,.8,.2,1) both}
.pop .it:nth-child(2){animation-delay:.04s}.pop .it:nth-child(3){animation-delay:.08s}.pop .it:nth-child(4){animation-delay:.12s}.pop .it:nth-child(5){animation-delay:.16s}.pop .it:nth-child(n+6){animation-delay:.2s}
.rp{overflow:hidden}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.28;transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}

/* ===== PERF: оптимизация анимаций для мобильных (120 Гц) ===== */
/* 1. Фоновые пятна: вместо filter:blur(80px) — radial-gradient (без фильтра, дёшево для GPU) */
#amb i{filter:none;transition:none;will-change:transform;background:radial-gradient(circle closest-side,var(--acc),transparent)}
#amb i:nth-child(2){background:radial-gradient(circle closest-side,var(--go),transparent)}
#obbg i{filter:none;transition:none;will-change:transform;background:radial-gradient(circle closest-side,var(--oc),transparent)}
/* 2. Переходы между экранами: без blur */
#app.out{filter:none;transition:opacity .15s ease-in,transform .15s ease-in}
@keyframes ghostOut{to{opacity:0;transform:translateX(var(--gx,-28px)) scale(.97)}}
.ghost{contain:layout paint;will-change:transform,opacity}
.ghost *,.ghost *::before,.ghost *::after{animation:none!important;transition:none!important}
/* 3. Бесконечные анимации, которые перерисовывали пиксели каждый кадр (background-position / box-shadow / text-shadow) */
.hero{animation:none}
.bar i,.sptb i:not(.low){animation:none;background-image:none}
.hero button:not(.g),.start,button.w:not(.g):not(:disabled){animation:none;background-size:auto;background-repeat:repeat;background-image:linear-gradient(180deg,rgba(255,255,255,.32) 0,rgba(255,255,255,.08) 48%,rgba(0,0,0,.07) 100%)}
#app .ob>button.w,#app .ob>button.w.fin{animation:obUp .5s .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
/* блик на hero/head — через transform (композитор), а не background-position */
.hero::before,.head::before{background-size:auto;animation:sheenT 6s ease-in-out infinite;will-change:transform}
.head{overflow:hidden}
@keyframes sheenT{0%,55%{transform:translateX(-110%)}100%{transform:translateX(110%)}}
/* пульс кнопки «слушать»: кольцо через transform+opacity вместо анимации box-shadow */
.spk.lsbtn{animation:none}
.spk.lsbtn::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--acc);opacity:0;pointer-events:none;animation:lsRing 1.9s ease-out infinite}
@keyframes lsRing{0%{transform:scale(1);opacity:.5}100%{transform:scale(1.4);opacity:0}}
.streakbox::before{will-change:transform,opacity}
/* 4. Карточка с 3D-переворотом: меньше больших размытых теней, отдельный слой */
.card{will-change:transform}
.mover{will-change:transform,opacity}
.face{box-shadow:0 12px 22px -14px var(--c)}
.mover.ok .back{box-shadow:0 0 0 4px #5ee0c0,0 0 18px rgba(94,224,192,.6)}
.mover.no .back{box-shadow:0 0 0 4px #ff7a7a,0 0 18px rgba(255,122,122,.5)}
/* 5. Статичные filter заменены на обычный фон; без drop-shadow на линиях */
.stack i:nth-child(1){filter:none;background:linear-gradient(rgba(0,0,0,.4),rgba(0,0,0,.4)),var(--c)}
.stack i:nth-child(2){filter:none;background:linear-gradient(rgba(0,0,0,.2),rgba(0,0,0,.2)),var(--c)}
.mgl{filter:none}
/* 6. Слишком большая волна: оставляем один эффект нажатия (.tap), второй (.rip) отключён */
.rip{display:none!important}
/* 7. кнопка фраз: пульс через opacity статичного слоя вместо анимации box-shadow; фон-частицы изолированы */
.w.phr:not([disabled]){animation:none;position:relative}
.w.phr:not([disabled])::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:0 0 0 5px var(--acc);opacity:0;pointer-events:none;animation:phGlow 1.6s ease-in-out infinite}
@keyframes phGlow{0%,100%{opacity:0}50%{opacity:.35}}
#fxl,#bgx{contain:layout paint style}
/* 8. выделение текста отключено (кроме полей ввода) */
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,[contenteditable=true]{-webkit-user-select:text;user-select:text}
/* 9. огонёк рядом с числом: ровно по центру строки */
.sfl{display:inline-flex;align-items:center;gap:3px;line-height:1;vertical-align:-4px}.sfl svg{display:block;flex:none}
/* 10. призрак в спринте, итог дуэли, недельный отчёт */
.spgh{display:inline-flex;align-items:center;gap:5px;opacity:.7;transition:opacity .2s,color .2s}.spgh svg{display:block}.spgh.ahead{color:#2fbf71;opacity:1}.spgh.behind{color:#ff6a6a;opacity:1}
.duel{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;margin:0 0 12px}.duel.win{color:#2fbf71}.duel.lose{color:#ff7a7a}
.wkb{display:flex;align-items:flex-start;gap:10px;margin-top:12px;padding:12px 14px;border-radius:16px;background:rgba(127,127,160,.12);font-weight:700;line-height:1.35}.wkb svg{flex:none;margin-top:1px}
.wkd{margin:2px 0 10px;font-weight:800}.wkd.up{color:#2fbf71}.wkd.dn{color:#ff7a7a}
/* ===== /PERF ===== */
/* фикс: стопка карточек не растягивается выше верхней карточки */
.stack{display:flex;flex-direction:column}
.stack .top{flex:1}

/* ===== v51: опыт, фразы, произношение, чтение ===== */
.xpb{height:6px;border-radius:4px;background:var(--line);margin-top:7px;overflow:hidden}
.xpb i{display:block;height:100%;background:var(--go);border-radius:4px;transition:width .5s cubic-bezier(.22,1,.36,1)}
.xpc small{display:block}
.xpf{position:fixed;left:50%;bottom:84px;z-index:9998;background:var(--card);color:var(--go);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:800;pointer-events:none;animation:xpf 1.25s ease-out forwards}
@keyframes xpf{0%{opacity:0;transform:translate(-50%,12px) scale(.9)}20%{opacity:1;transform:translate(-50%,0) scale(1)}80%{opacity:1;transform:translate(-50%,-10px)}100%{opacity:0;transform:translate(-50%,-34px)}}
.tl{display:inline-flex;align-items:center;justify-content:center;padding:10px 14px;border-radius:14px;font-size:17px;font-weight:700;min-height:46px}
.tl.z{font-size:24px;padding:8px 14px}
.tl.ph{visibility:hidden}
.bwa{min-height:84px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding:10px;border-radius:16px;border:2px dashed var(--line);margin:12px 0 4px}
.bwb{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0 4px}
html:root .tl.okt{border-color:var(--go);background-color:rgba(94,224,192,.18)}
html:root .tl.bad{border-color:#ff6b6b;background-color:rgba(255,107,107,.18)}
/* ===== фразы: анимации и иконки ===== */
.emo{display:inline-block;width:1.1em;height:1.1em;vertical-align:-.17em;line-height:1}
.emo svg{width:100%;height:100%;display:block}
.stack .top b .emo,.head h1 .emo,.bar0 h1 .emo{box-sizing:border-box;width:1.65em;height:1.65em;padding:.15em;margin-right:.3em;vertical-align:-.35em;border-radius:.5em}
.stack .top b .emo{background:rgba(0,0,0,.3);background:color-mix(in srgb,var(--c) 68%,#000);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.3),0 2px 5px rgba(0,0,0,.22)}
.head h1 .emo,.bar0 h1 .emo{background:rgba(110,100,200,.14);box-shadow:inset 0 0 0 1.5px rgba(110,100,200,.2)}
#phsc,#phc{display:inline-block}
.bmp{animation:bump .4s cubic-bezier(.34,1.56,.64,1)}
.phin{animation:slideF .38s cubic-bezier(.22,1,.36,1)}
.tl{transition:background-color .2s,border-color .2s}
.tl.phpop{animation:phPlace .38s cubic-bezier(.34,1.56,.64,1)}
.bwb.intro .tl{animation:phDrop .5s cubic-bezier(.34,1.56,.64,1) backwards;animation-delay:calc(var(--i)*70ms)}
.bwa .tl.okt{animation:phWave .7s ease calc(var(--i)*90ms) 1}
.bwa .tl.bad{animation:phBad .5s ease}
.bwa.shk{animation:mgShake .45s}
.bwa:empty::after{content:"";width:100%;height:46px}
.bwb~.fb:not(:empty){animation:phFb .45s cubic-bezier(.34,1.56,.64,1)}
.w.phr:not([disabled]){animation:lsPulse 1.6s ease-in-out infinite}
@keyframes phPlace{0%{transform:scale(.55) translateY(12px);opacity:.4}60%{transform:scale(1.12)}100%{transform:none;opacity:1}}
@keyframes phDrop{from{opacity:0;transform:translateY(-26px) rotate(-8deg) scale(.8)}to{opacity:1;transform:none}}
@keyframes phWave{0%,100%{transform:none}40%{transform:translateY(-12px) scale(1.1)}}

IC.gear=z=>{
  const n=8,R=29,r=22,c=32;let d='';
  for(let i=0;i<n;i++){
    const a=i*2*Math.PI/n,w=Math.PI/n;
    [[a-w*.5,r],[a-w*.3,R],[a+w*.3,R],[a+w*.5,r]].forEach(([t,rad],k)=>{d+=(i===0&&k===0?'M':'L')+(c+rad*Math.cos(t)).toFixed(1)+' '+(c+rad*Math.sin(t)).toFixed(1)});
  }
  d+='Z M32 22a10 10 0 1 0 .01 0Z';
  return `<svg width="${z}" height="${z}" viewBox="0 0 64 64" aria-hidden="true"><path d="${d}" fill="var(--acc)" fill-rule="evenodd" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round"/><circle cx="32" cy="32" r="4" fill="#5ee0c0"/></svg>`;
};

/* ===== Произношение ===== */
let pns=null,pnR=null;
function openPn(k){D.course=k;pns={cr:k,stage:'start'};go('pn')}
const pnNatP=()=>{try{const C=window.Capacitor;return(C&&C.Plugins&&C.Plugins.SpeechRecognition)||null}catch(e){return null}};
const pnWeb=()=>window.SpeechRecognition||window.webkitSpeechRecognition||null;
const pnSup=()=>!!(pnNatP()||pnWeb());
function pnStop(){
  const r=pnR;pnR=null;
  try{if(r==='nat'){const P=pnNatP();if(P&&P.stop)P.stop()}else if(r&&r.abort)r.abort()}catch(e){}
  if(pns&&pns.cur)pns.cur.listening=false;
}
function lev(a,b){
  const m=a.length,n=b.length;if(!m)return n;if(!n)return m;
  let p=[];for(let j=0;j<=n;j++)p[j]=j;
  for(let i=1;i<=m;i++){const q=[i];for(let j=1;j<=n;j++)q[j]=Math.min(p[j]+1,q[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=q}
  return p[n];
}
function pnPool(cr){
  const out=[],seen=new Set();
  D.cats.forEach(c=>{if(crOf(c)!==cr)return;c.decks.forEach(d=>{if(d.auto==null)return;d.cards.forEach(x=>{
    if(!x.f||!x.b||x.o||x.f.length>26||x.f.split(/\s+/).length>4||x.f.indexOf('___')>=0||seen.has(x.f))return;seen.add(x.f);out.push(x)})})});
  return out;
}
function pnGo(){
  const pool=shuf(pnPool(pns.cr)).slice(0,8);
  if(pool.length<4){toast(t('mgNeed'),'warn');return}
  pns=Object.assign(pns,{stage:'play',pool,n:pool.length,k:0,sum:0,ok:0,rec:false});
  pnCard();render();
}
function pnCard(){const x=pns.pool[pns.k];pns.cur={f:x.f,p:x.p,b:x.b,res:null,best:0,listening:false,err:null}}
function pnDraw(){const e=$('#pnb');if(e)e.innerHTML=pnBody()}
async function pnListen(){
  const c=pns&&pns.cur;if(!c||c.listening)return;
  c.res=null;c.err=null;c.listening=true;pnDraw();
  const lang=spkT();
  const fin=a=>{c.listening=false;pnR=null;pnScore(a)};
  const P=pnNatP();
  if(P){
    try{
      pnR='nat';
      try{await P.requestPermissions()}catch(e){}
      const r=await P.start({language:lang,maxResults:5,prompt:'',partialResults:false,popup:false});
      if(pnR!=='nat')return;
      fin((r&&r.matches)||[]);
    }catch(e){c.listening=false;pnR=null;c.err=/denied|permission/i.test(String(e&&(e.message||e)))?'deny':'mic';pnDraw()}
    return;
  }
  const R=pnWeb();
  try{
    const r=new R();pnR=r;r.lang=lang;r.interimResults=false;r.maxAlternatives=5;r.continuous=false;
    let got=null;
    r.onresult=e=>{const a=[];for(let i=0;i<e.results.length;i++){const rs=e.results[i];for(let j=0;j<rs.length;j++)a.push(rs[j].transcript)}got=a};
    r.onerror=e=>{const er=e&&e.error;c.err=(er==='not-allowed'||er==='service-not-allowed')?'deny':(er==='no-speech'?'none':'mic')};
    r.onend=()=>{if(pnR!==r)return;if(got&&got.length)fin(got);else{c.listening=false;pnR=null;if(!c.err)c.err='none';pnDraw()}};
    r.start();
  }catch(e){c.listening=false;pnR=null;c.err='mic';pnDraw()}
}
function pnScore(alts){
  const c=pns.cur,tg=Array.from(wrNorm(c.f));let best=-1,said='';
  (alts||[]).forEach(a=>{
    const n=Array.from(wrNorm(a));if(!n.length||!tg.length)return;
    let s=1-lev(n,tg)/Math.max(n.length,tg.length);
    if(tg.length>=3&&n.join('').indexOf(tg.join(''))>=0)s=Math.max(s,.9);
    if(s>best){best=s;said=a}
  });
  if(best<0){c.err='none';pnDraw();return}
  const pct=Math.max(0,Math.round(best*100)),xf=p=>p>=80?15:p>=55?5:0,old=c.best||0;
  if(pct>old){addXp(xf(pct)-xf(old));c.best=pct}
  if(pct>=80)D.pnHi=1;
  c.res={pct,said};buzz(pct>=55);save();pnDraw();chkAch();
}
function pnSelf(){const c=pns.cur;if(!c||c.res)return;c.res={pct:100,said:'',self:1};if(!c.best){c.best=100;addXp(15)}buzz(true);pnDraw()}
function pnNext(){
  const c=pns&&pns.cur;if(!c)return;
  pnStop();pns.sum+=c.best||0;if((c.best||0)>=80)pns.ok++;
  pns.k++;if(pns.k>=pns.n){pnFinish();return}
  pnCard();render();
}
function pnFinish(){
  const old=D.pnB[pns.cr]||0;pns.rec=pns.sum>old;if(pns.rec)D.pnB[pns.cr]=pns.sum;D.pnN=(D.pnN||0)+1;
  pns.stage='done';save();sfx(pns.rec?'rec':'goal');render();chkAch();
}
function pnBody(){
  const c=pns.cur,r=c.res,sup=pnSup();
  let h=`<div class="qs" style="min-height:0;margin-top:10px">${c.p?`<div class="zh">${esc(c.f)}</div><div class="py">${esc(c.p)}</div>`:esc(c.f)}</div><p class="mute" style="margin:4px 0 10px">${esc(c.b)}</p>
  <button class="spk lsbtn" style="width:60px;height:60px;margin:0 auto 6px" onclick="speak(pns.cur.f)" aria-label="Play">${IC.spk(28)}</button>`;
  if(sup)h+=`<button class="micb${c.listening?' on':''}" onclick="pnListen()"${c.listening?' disabled':''} aria-label="Mic">${IC.mic(44)}</button>`;
  else h+=`<p class="mute" style="margin:8px 0">${esc(t('pnNo'))}</p>${r?'':`<button class="w" onclick="pnSelf()">${t('pnSelf')}</button>`}`;
  let res=`<p class="mute">${esc(t('pnTap'))}</p>`;
  if(c.listening)res=`<p class="mute">${esc(t('pnLis'))}</p>`;
  else if(c.err)res=`<p class="mute" style="color:#ff7a7a">${esc(t(c.err==='deny'?'pnDeny':c.err==='none'?'pnNone':'pnMic'))}</p>`;
  else if(r){const cl=r.pct>=80?'ok':r.pct>=55?'':'no';res=`<div class="v ${cl}">${r.pct}% · ${esc(t(r.pct>=80?'pnGood':r.pct>=55?'pnClose':'pnBad'))}</div>${r.said?`<small class="mute">${esc(t('pnHeard'))}: ${esc(r.said)}</small>`:''}`}
  return h+`<div class="pnr">${sup||!r?(sup?res:''):res}</div><button class="w g" onclick="pnNext()"${c.listening?' disabled':''}>${t('nextB')}</button>`;
}
function pnHTML(){
  const nm=esc(t(CRM[pns.cr][0]));
  if(pns.stage==='start'){
    const b=D.pnB[pns.cr]||0;
    return `<div class="bar0"><button class="g" onclick="go('course')">${t('back')}</button></div><div class="lvres"><div style="font-size:54px">🎙️</div><h1>${esc(t('pnT'))} · ${nm}</h1><p class="mute">${esc(t('pnRules'))}</p>${pnSup()?'':`<p class="mute" style="color:#ff7a7a">${esc(t('pnNo'))}</p>`}${b?`<p class="lvd">🏆 ${t('mgBest')}: ${b}</p>`:''}<button class="w" onclick="pnGo()">${t('mgGo')}</button></div>`;
  }
  if(pns.stage==='play'){
    return `<div style="--c:${CC(5)}"><div class="sbar"><button class="g x" onclick="go('course')" aria-label="${t('finish')}">✕</button><div class="bar"><i style="width:${pbar}%" data-w="${pns.k/pns.n*100}"></i></div><span class="mute">${pns.k+1}/${pns.n}</span></div>
    <div class="spw" style="margin-top:6px;text-align:center"><small class="mute">${esc(t('pnT'))} · ${nm}</small><div id="pnb">${pnBody()}</div></div></div>`;
  }
  const avg=Math.round(pns.sum/pns.n);
  return conf()+`<div class="lvres"><small class="mute">${esc(t('pnT'))} · ${nm}</small><div class="lvbig">${pns.sum}</div><p class="lvd">${esc(t('mgPts'))}</p><div class="mgst"><span>✓ ${pns.ok}/${pns.n}</span><span>${avg}%</span></div>${pns.rec?`<p class="lvd" style="color:var(--go)">🏆 ${esc(t('mgRec'))}</p>`:''}
  <button class="w" onclick="pnGo()">${t('lsAgain2')}</button><button class="w g" style="margin-top:10px" onclick="go('course')">${t('backBtn')}</button></div>`;
}

{id:"en9",cr:"en",lv:"B2",ti:["Working from home", "Работа из дома", ""],tr:["", "Сегодня многие компании разрешают сотрудникам работать из дома несколько дней в неделю. Сторонники утверждают, что это экономит время и повышает продуктивность. Однако некоторые работники чувствуют себя изолированно и с трудом отделяют работу от личной жизни. По моему мнению, гибкий график — лучшее решение.", ""],

{id:"en11",cr:"en",lv:"C1",ti:["The value of failure", "Ценность неудачи", ""],tr:["", "Часто говорят, что мы учимся на неудачах больше, чем на успехах, однако немногие открыто признают свои ошибки. Общество награждает результат и не замечает усилий за ним, из-за чего люди неохотно идут на риск. Тем не менее многие выдающиеся открытия сделали те, кто упорствовал, несмотря на неудачи.", ""],

{id:"de11",cr:"de",lv:"C1",ti:["The value of failure", "Ценность неудачи", ""],tr:["It is often said that we learn more from failures than from successes, yet few of us admit our mistakes openly. Society rewards results and overlooks the effort behind them, which makes people reluctant to take risks. Nevertheless, many remarkable discoveries were made by those who persisted despite repeated setbacks.", "Часто говорят, что мы учимся на неудачах больше, чем на успехах, однако немногие открыто признают свои ошибки. Общество награждает результат и не замечает усилий за ним, из-за чего люди неохотно идут на риск. Тем не менее многие выдающиеся открытия сделали те, кто упорствовал, несмотря на неудачи.", ""],

{id:"de12",cr:"de",lv:"C1",ti:["Information overload", "Информационная перегрузка", ""],tr:["In an age when information is available at the touch of a button, the real challenge is no longer finding facts but judging which of them deserve our trust. The sheer volume of content can overwhelm us and, paradoxically, leave us less informed. Critical thinking has therefore become an essential skill.", "В эпоху, когда информация доступна одним нажатием кнопки, главная задача — уже не найти факты, а оценить, каким из них можно доверять. Огромный объём контента может подавить нас и, как ни парадоксально, оставить хуже информированными. Поэтому критическое мышление стало необходимым навыком.", ""],

{id:"ko10",cr:"ko",lv:"B2",ti:["A city without cars", "Город без машин", ""],tr:["Several European cities have banned cars from their centres in order to reduce pollution. At first, shop owners feared they would lose customers, but the opposite happened. Streets became quieter and safer, and more people started to walk and cycle. Although the change was not easy, most residents now say their quality of life has improved.", "Несколько европейских городов запретили автомобили в центре, чтобы снизить загрязнение. Сначала владельцы магазинов боялись потерять покупателей, но произошло обратное. Улицы стали тише и безопаснее, и больше людей начали ходить пешком и ездить на велосипеде. Хотя перемены давались нелегко, большинство жителей теперь говорят, что качество их жизни улучшилось.", ""],

    const cards=(arr||[]).map(c=>Array.isArray(c)?[c[0],c[1]]:[c.q||c.f,c.a||c.b,c.o||c.options]).filter(c=>c[0]&&c[1]);

  }catch(e){}

  clean.split('\n').forEach(l=>{const j=l.indexOf('=');if(j<1)return;const f=l.slice(0,j).trim(),b=l.slice(j+1).trim();if(f&&b)cards.push([f,b])});

/* ===== названия карточек-разделов: в одну строку, шрифт сам уменьшается ===== */
(function(){
  let tm=0;
  function fit(){
    try{
      const bs=[...document.querySelectorAll('.stack .top b')],jobs=[];
      bs.forEach(b=>{const w=b.parentElement.clientWidth,k=w+'|'+b.textContent;if(w&&b._fk!==k)jobs.push([b,w,k])});
      jobs.forEach(([b,w,k])=>{
        b.classList.remove('fit1');b.style.fontSize='';
        b.classList.add('fit1');
        let fs=parseFloat(getComputedStyle(b).fontSize)||18;
        while(b.scrollWidth>w+0.5&&fs>11){fs-=.5;b.style.fontSize=fs+'px'}
        if(b.scrollWidth>w+0.5){b.classList.remove('fit1');b.style.fontSize=''}
        b._fk=k;
      })
    }catch(e){}
  }
  function later(){clearTimeout(tm);tm=setTimeout(fit,30)}
  /* подгонка названий нужна только когда в DOM появились карточки-разделы, а не при каждом изменении страницы */
  try{new MutationObserver(ms=>{for(const m of ms)for(const n of m.addedNodes)if(n.nodeType===1&&(n.matches('.stack')||n.querySelector('.stack'))){later();return}}).observe(document.body,{childList:true,subtree:true})}catch(e){}
  addEventListener('resize',later);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(later);
  later();
})();
